[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-cli-python"
version = "0.2.0"
description = "Python CLI for Hyperliquid DEX"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
authors = [{ name = "hyperliquid-cli contributors" }]
dependencies = [
  "rich>=13.7.1",
  "hyperliquid-python-sdk>=0.18.0",
  "eth-account>=0.13.4",
]

[project.urls]
Source = "https://github.com/haturatu/hl"

[project.scripts]
hl = "hl_cli.cli.argparse_main:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
hl_cli = ["locale/*/LC_MESSAGES/*.mo", "locale/*/LC_MESSAGES/*.po"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hl_cli*"]

[tool.ruff]
# `_`/`ngettext` are injected by the gettext-based i18n module.
builtins = ["_", "ngettext"]

[tool.ruff.lint]
# Ruff 0.16 expanded its default rules. Keep the project's existing lint
# baseline stable; opt in to additional rules in separate cleanup changes.
select = ["E4", "E7", "E9", "F"]
