[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-cli-python"
version = "0.1.8"
description = "Python CLI for Hyperliquid DEX"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
authors = [{ name = "hyperliquid-cli contributors" }]
dependencies = [
  "rich>=13.7.1",
  "hyperliquid-python-sdk>=0.18.0",
  "eth-account>=0.13.4",
]

[project.urls]
Source = "https://github.com/haturatu/hl"

[project.scripts]
hl = "hl_cli.cli.argparse_main:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hl_cli*"]
